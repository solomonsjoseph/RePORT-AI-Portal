name: report-ai-study-pipeline
version: 0.2.0
kind: llm-plugin-pack
description: >
  Platform-neutral RePORT-AI study preparation plugin pack. The plugin IS the
  pipeline: a 10-phase orchestrator skill governs the raw-to-llm_source publish
  path end to end — header extraction, dictionary extraction, deduplication,
  Source Truth generation, PHI classification + scrubbing, audit verification,
  the Presidio+pyCANON PHI guard gate, promotion, staging destruction, the
  cleanup verifier, and the immutable snapshot. PHI row values never reach any
  LLM; skills read column NAMES and metadata only.
license: MIT
platforms:
  primary: generic-llm
  adapters:
    - codex
    - claude
    - chatgpt
    - cursor
    - gemini

# ── Entry point ──────────────────────────────────────────────────────────────
# The orchestrator skill is the single entry point. Its run.py is a 10-phase
# state machine that holds the per-study pipeline lock for the whole run and
# invokes the pipeline skills as file-path subprocesses (hyphenated skill dirs
# are not importable as Python modules — D3). Operators launch it via
# `make study STUDY=<name>` (which exports STUDY_NAME and delegates here).
entrypoint:
  skill: report-ai-study-pipeline
  path: skills/report-ai-study-pipeline/SKILL.md
  run: skills/report-ai-study-pipeline/scripts/run.py
  command: make study STUDY=<name>

# ── Orchestrator topology ────────────────────────────────────────────────────
# The conceptual 10 runtime phases map onto the supervisory steps run.py drives.
# The contiguous publish phases 2-7 are executed by the proven
# `dataset-to-llm-source` publish supervisor in one locked subprocess (which
# itself invokes the host publish engine, scripts.pipeline.host_pipeline), rather
# than being re-decomposed into separate subprocesses.
orchestrator:
  skill: report-ai-study-pipeline
  lock: per_study_exclusive_whole_run
  state_file: output/<STUDY>/runs/<RUN_ID>/run_state.json
  phases:
    - phase: 0
      name: preflight
      action: Config validation ∥ rulebook fetch/drift · input-fingerprint redundant-run check · dir pre-creation · acquire lock
      skills: []
    - phase: 1
      name: headers
      action: Header extraction ∥ dictionary extraction (column NAMES only; gates classification)
      skills: [header-extraction, dictionary-to-llm-source]
    - phase: 2
      name: deduplication
      action: Per-form duplicate detection (scrub-first; provably-safe merges only)
      skills: [dataset-deduplication]
    - phase: 3
      name: sot-classify-extract
      action: Source Truth ∥ PHI classification ∥ full data extraction
      skills: [sot-lean-generator, phi-classification, dataset-to-llm-source]
    - phase: 3b
      name: cross-form-barrier
      action: Cross-form PHI-classification consistency barrier
      skills: [phi-classification]
    - phase: 4
      name: phi-scrubbing
      action: Per-form PHI scrub pipeline (fail-closed; date jitter + pseudonymize + drop/generalize/band)
      skills: [phi-scrubbing]
    - phase: 5
      name: audit-verification
      action: 14-assertion audit verification
      skills: [audit-verification]
    - phase: 6
      name: guard-gate-promote
      action: PHI guard gate (Presidio + pyCANON, OR-combined) → atomic promotion to llm_source/
      skills: [dataset-to-llm-source]
    - phase: 7
      name: cleanup-destroy
      action: Cleanup propagation ∥ staging destruction + attestation ∥ artifact cleanup ∥ key zero
      skills: [dataset-to-llm-source]
    - phase: 8
      name: cleanup-verifier
      action: Cleanup verifier over the published tree + cleanup ledgers (orchestrator module)
      skills: []
    - phase: 9
      name: full-verifier
      action: Idempotent 14-assertion re-verify
      skills: [audit-verification]
    - phase: 10
      name: finalize
      action: Snapshot commit → current pointer → status.json → lock release (orchestrator module)
      skills: []

# ── Skills ───────────────────────────────────────────────────────────────────
# Each pipeline skill has scripts/run.py (the subprocess contract) and a SKILL.md.
# phi-rulebook is a shared-module skill consumed in phase 0 + by phi-classification
# (not a DAG node). study-setup is interactive and NOT an orchestrator phase.
skills:
  - skill: header-extraction
    path: skills/header-extraction/SKILL.md
    run: skills/header-extraction/scripts/run.py
    role: dag
    scope: raw_file_set
    parallel: true
    purpose: Extract row-1 column NAMES only from raw datasets; gates PHI classification.
  - skill: dictionary-to-llm-source
    path: skills/dictionary-to-llm-source/SKILL.md
    run: skills/dictionary-to-llm-source/scripts/run.py
    role: dag
    scope: study
    parallel: true
    purpose: Extract + publish the study data dictionary mapping (no PHI; URLs masked at publish).
  - skill: dataset-deduplication
    path: skills/dataset-deduplication/SKILL.md
    run: skills/dataset-deduplication/scripts/run.py
    role: dag
    scope: raw_file_set
    parallel: true
    purpose: Scrub-first duplicate-file detection; merge only provably-safe duplicates, else hold for review.
  - skill: sot-lean-generator
    path: skills/sot-lean-generator/SKILL.md
    run: skills/sot-lean-generator/scripts/run.py
    role: dag
    scope: raw_file_set
    parallel: true
    purpose: Build/audit Source Truth policy YAML from printed PDFs + row-1 dataset headers only.
  - skill: phi-classification
    path: skills/phi-classification/SKILL.md
    run: skills/phi-classification/scripts/run.py
    role: dag
    scope: raw_file_set
    parallel: true
    purpose: Deterministic jurisdiction PHI classification from headers + SoT signals (no row values).
  - skill: phi-scrubbing
    path: skills/phi-scrubbing/SKILL.md
    run: skills/phi-scrubbing/scripts/run.py
    role: dag
    scope: study
    parallel: false
    purpose: Fail-closed per-form PHI scrub (date jitter, pseudonymize, drop/generalize/band, quarantine).
  - skill: dataset-to-llm-source
    path: skills/dataset-to-llm-source/SKILL.md
    run: skills/dataset-to-llm-source/scripts/run.py
    role: dag
    scope: study
    parallel: lock_aware_only
    purpose: Publish supervisor — classify → extract → scrub → dedup → PHI guard gate → promote → destroy → inline verify → snapshot.
  - skill: audit-verification
    path: skills/audit-verification/SKILL.md
    run: skills/audit-verification/scripts/run.py
    role: dag
    scope: study
    parallel: false
    purpose: Run the 14-assertion verifier; idempotent re-verify in phase 9.
  - skill: excel-duplicate-handler
    path: skills/excel-duplicate-handler/SKILL.md
    role: legacy_preflight
    scope: study
    parallel: false
    purpose: >
      Legacy workbook merge helper (superseded by dataset-deduplication at orchestrator
      phase 2 — Note 18). Retained for manual maintainer preflight only; not invoked
      by the 10-phase orchestrator.
  - skill: phi-rulebook
    path: skills/phi-rulebook/SKILL.md
    role: shared_module
    scope: study
    parallel: false
    purpose: Versioned offline PHI rulebook cache + drift detection; consumed in phase 0 and by phi-classification.
  - skill: study-setup
    path: skills/study-setup/SKILL.md
    run: skills/study-setup/scripts/run.py
    role: interactive
    scope: study
    parallel: false
    purpose: Interactive study scaffolding (manifest/privacy config, PHI key bootstrap). NOT an orchestrator phase.

raw_file_set:
  definition: >
    One canonical form/work unit after duplicate preflight, containing the
    associated raw dataset workbook or CSV, matching printed PDF when Source
    Truth is required, manifest/privacy context, duplicate variants already
    resolved or held for review, and the per-set output/audit status.
  identity:
    - study
    - form_id
  inputs:
    - data/raw/<STUDY>/datasets/<FORM>.xlsx or .csv
    - data/raw/<STUDY>/annotated_pdfs/<FORM>.pdf when Source Truth is required
    - config/<STUDY>/_forms_manifest.yaml
    - config/<STUDY>/_study_privacy.yaml
  statuses:
    - ready
    - held_duplicate_review
    - held_sot_review
    - held_publish_review
    - complete

privacy_boundary:
  dataset_values: trusted_pipeline_only
  agent_allowed_inputs:
    - file names
    - directory shape
    - manifests
    - study privacy config
    - row-1 headers through approved paths
    - printed PDF/page renders
    - audit reports and verifier outputs that contain metadata only

host_repo_contract:
  required_paths:
    - data/raw/<STUDY>/
    - data/raw/<STUDY>/data_dictionary/
    - config/<STUDY>/_forms_manifest.yaml
    - config/<STUDY>/_study_privacy.yaml
    - config/_defaults/phi_scrub.yaml
    - plugins/report-ai-study-pipeline/skills/report-ai-study-pipeline/scripts/run.py
    - plugins/report-ai-study-pipeline/skills/dataset-to-llm-source/scripts/extract_to_llm_source.py
    - plugins/report-ai-study-pipeline/skills/sot-lean-generator/scripts/study_intake.py
    - plugins/report-ai-study-pipeline/skills/sot-lean-generator/scripts/generate_lean_outputs.py
    - scripts/pipeline/host_pipeline.py
  expected_outputs:
    - output/<STUDY>/llm_source/SoT/<PAIR>/joined/<FORM>_joined_query_view.yaml
    - output/<STUDY>/llm_source/dataset_schema/files/<FORM>.jsonl
    - output/<STUDY>/llm_source/dictionary_mapping/jsonl/**/*.jsonl when raw dictionary files exist
    - output/<STUDY>/snapshots/<SNAPSHOT_ID>/ (immutable clean-pass snapshot)
    - output/<STUDY>/audit/lineage_manifest.json
  optional_paths:
    - .codex-plugin/plugin.json
    - .agents/plugins/marketplace.json

adapters:
  generic_llm:
    agent_metadata: agents/llm.yaml
  codex:
    manifest: .codex-plugin/plugin.json
    skills: skills/
    agent_metadata: agents/llm.yaml
