# Maintainer template for config/<STUDY>/_study_privacy.yaml (Note 11).
# Copy and customize per study; the study-setup wizard writes a completed file.
jurisdictions:
  - USA
  - INDIA
data_as_of: "YYYY-MM-DD"
rule_refresh: online_preferred
conflict_policy: strictest_wins
approval:
  mode: hybrid
  max_synthetic_attempts: 5
parallelism:
  mode: auto
# Note 5: required for publish — host_pipeline fail-closes when absent/disabled.
# Replace quasi_identifiers with study-specific column NAMES (never row values).
kanon_publish_gate:
  enabled: true
  quasi_identifiers: []
  k_threshold: 5
